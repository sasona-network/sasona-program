[package]
name = "sasona"
version = "0.1.0"
description = "The Sasona pool"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "sasona"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["token", "associated_token"] }

[dev-dependencies]
litesvm = "0.17.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
solana-instruction = "3.5"
solana-address = { version = "2.7", features = ["curve25519"] }
solana-account = "4"
solana-program-pack = "3"
spl-token-interface = "2"
spl-associated-token-account-interface = "2"
solana-clock = "3.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
